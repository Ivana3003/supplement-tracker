<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supplement Tracker</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="images/pills.png" />
  </head>
  <body>
    <header>
      <div class="header-container">
        <h1 id="main-title">Pratilac suplemenata</h1>
        <div class="lang-switcher">
          <button id="btn-sr" class="active">SR</button>
          <span>|</span>
          <button id="btn-en">EN</button>
        </div>
      </div>
    </header>

    <main class="main-container">
      <section class="input-section">
        <div class="input-group">
          <div class="field">
            <label id="lbl-name" for="input-name">Naziv</label>
            <input type="text" id="input-name" placeholder="npr. Koenzim Q10" />
          </div>
          <div class="field">
            <label id="lbl-dosage" for="input-dosage">Doza</label>
            <input type="text" id="input-dosage" placeholder="npr. 100 mg" />
          </div>
          <div class="field">
            <label id="lbl-time" for="input-time">Vreme</label>
            <input type="time" id="input-time" />
          </div>
          <div class="field btn-field">
            <button id="add-btn">Dodaj</button>
          </div>
        </div>
      </section>

      <section class="list-section">
        <h2 id="list-title">Moji suplementi</h2>
        <div id="supplement-list" class="grid-container"></div>
      </section>

      <section class="water-section">
        <h2 id="water-title">Podsetnik za vodu 💧</h2>
        <div class="water-controls">
          <p id="water-text">
            <span id="water-count">0</span>
          </p>
          <div class="water-buttons">
            <button id="add-water">Dodaj čašu</button>
            <button id="reset-water">Resetuj</button>
          </div>
        </div>
      </section>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
