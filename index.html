<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Precision-driven health companion by Ivana Tatić (Master of Chemistry). Track supplements and hydration with smart notifications and LocalStorage persistence. Where lab-grade accuracy meets modern web dev."
    />
    <title>Supplement Tracker</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="images/pills.png" />
  </head>
  <body>
    <header>
      <div class="header-container">
        <h1 id="main-title">Pratilac suplemenata</h1>
        <div class="lang-switcher">
          <button id="btn-sr" class="active" type="button">SR</button>
          <span>|</span>
          <button id="btn-en" type="button">EN</button>
        </div>
        <button id="logout-btn" type="button" class="danger" hidden>
          Odjavi se
        </button>
      </div>
    </header>

    <section id="auth-shell" class="auth-shell" aria-live="polite">
      <div class="auth-card">
        <h2 id="auth-title">Prijava / registracija</h2>
        <p id="auth-status" class="auth-status">
          Ulogujte se da biste pristupili svom kalendaru suplemenata.
        </p>

        <form id="auth-form" class="auth-form">
          <label for="auth-email">Email</label>
          <input
            id="auth-email"
            type="email"
            name="email"
            placeholder="you@example.com"
            required
          />

          <label for="auth-password">Password</label>
          <input
            id="auth-password"
            type="password"
            name="password"
            placeholder="********"
            required
          />

          <div class="auth-actions">
            <button id="login-btn" type="submit" data-mode="login">
              Prijavi se
            </button>
            <button
              id="register-btn"
              type="button"
              class="secondary"
              data-mode="register"
            >
              Registruj se
            </button>
          </div>
        </form>
      </div>
    </section>

    <main id="app-shell" class="main-container" hidden>
      <section class="input-section">
        <div class="input-group">
          <div class="field">
            <label id="lbl-name" for="input-name" data-i18n="lblName"
              >Naziv</label
            >
            <input
              type="text"
              id="input-name"
              placeholder="npr. Koenzim Q10"
              required
            />
          </div>
          <div class="field">
            <label id="lbl-dosage" for="input-dosage" data-i18n="lblDosage"
              >Doza</label
            >
            <input
              type="text"
              id="input-dosage"
              placeholder="npr. 100 mg"
              required
            />
          </div>
          <div class="field">
            <label id="lbl-time" for="input-time" data-i18n="lblTime"
              >Vreme</label
            >
            <input type="time" id="input-time" required />
            <ul
              id="selected-times"
              class="selected-times"
              aria-live="polite"
            ></ul>
          </div>
          <div class="field btn-field">
            <button id="add-btn" type="button">Dodaj</button>
            <button id="add-time-btn" type="button">Dodaj vreme</button>
            <button id="cancel-edit-btn" type="button" hidden>Otkaži</button>
          </div>
        </div>
      </section>

      <section class="list-section">
        <h2 id="list-title" data-i18n="listTitle">Moji suplementi</h2>
        <div class="list-controls">
          <label
            for="supplement-search"
            class="sr-only"
            data-i18n="searchSupplements"
            >Pretraži suplemente</label
          >
          <input
            type="search"
            id="supplement-search"
            placeholder="Pretraži suplemente"
          />
          <label
            for="supplement-sort"
            class="sr-only"
            data-i18n="sortSupplements"
            >Sortiraj suplemente</label
          >
          <select id="supplement-sort">
            <option value="name" data-i18n="sortName">Naziv A–Z</option>
            <option value="time" data-i18n="sortTime">Najranije vreme</option>
            <option value="newest" data-i18n="sortNewest">
              Najnovije dodato
            </option>
          </select>
        </div>
        <section class="api-search" aria-labelledby="api-search-title">
          <h3 id="api-search-title">Pretraži bazu suplemenata</h3>
          <form id="api-search-form" class="api-search-form">
            <label for="api-search-input" class="sr-only"
              >Pretraži bazu suplemenata</label
            >
            <input
              type="search"
              id="api-search-input"
              placeholder="npr. vitamin D"
            />
            <button type="submit" id="api-search-btn">Pretraži</button>
          </form>
          <p
            id="api-search-status"
            class="api-search-status"
            role="status"
            aria-live="polite"
          ></p>
          <div id="api-results" class="api-results"></div>
        </section>
        <p id="empty-state" class="empty-state" hidden></p>
        <div id="supplement-list" class="grid-container"></div>
      </section>

      <section class="water-section">
        <h2 id="water-title" data-i18n="waterTitle">Podsetnik za vodu 💧</h2>
        <button
          id="notification-btn"
          type="button"
          aria-label="Omogući podsetnike"
          title="Omogući podsetnike"
        >
          🔕
        </button>
        <div class="water-controls">
          <p id="water-text">
            <span id="water-count">0</span>
          </p>
          <div class="water-buttons">
            <button id="add-water" type="button">Dodaj čašu</button>
            <button id="reset-water" type="button">Resetuj</button>
          </div>
        </div>
      </section>
    </main>

    <script src="js/firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="js/supplement-api.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
